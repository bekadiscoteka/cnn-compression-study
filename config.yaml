# Experiment settings. Change values here, not in code.

model: mobilenetv2
width_mult: 0.35
dataset: cifar10

train:
  epochs: 100
  batch_size: 128
  lr: 0.05
  optimizer: sgd
  weight_decay: 4.0e-5

finetune_epochs: 15        # same budget for every configuration
finetune_lr: 0.01
qat_epochs: 5              # quantization-aware fine-tuning, same for every ratio
qat_lr: 0.001
calibration_images: 500    # calibration set size, same images for PTQ and QAT
calibration:
  method: auto             # auto = choice made by calibrate_check.py on a validation split; or minmax / percentile
  percentile: 99.99        # used only when method is percentile
results_file: results_v2.csv   # v1 (MinMax calibration, EMA ranges in QAT) archived as results_v1_minmax.csv

pruning_ratios: [0.0, 0.25, 0.50, 0.75]
quantization: [fp32, ptq, qat]
seeds: [1, 2, 3]

selection_rule:
  max_accuracy_drop_pp: 1.0   # best = lowest energy within 1 pp of fp32 baseline

hardware:
  board: STM32H7B3I-DK        # STM32H7B3, Cortex-M7, 2 MB internal Flash, 1.4 MB RAM; fixed for every run
  clock_mhz: 280              # board default maximum in ST Edge AI Developer Cloud
  st_edge_ai: 4.1.0
  st_optimization: balanced   # code-generation objective; I/O buffers inside activation buffer (default)
